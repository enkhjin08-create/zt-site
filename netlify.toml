[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/delivery-quote"
  to = "/.netlify/functions/delivery-quote"
  status = 200

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200

[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/products"
  status = 200

[[redirects]]
  from = "/api/upload"
  to = "/.netlify/functions/upload"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200

[[redirects]]
  from = "/api/qpay"
  to = "/.netlify/functions/qpay"
  status = 200

[[headers]]
  for = "/sw-admin.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest-admin.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
